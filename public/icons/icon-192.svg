<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#2563EB"/>
  <!-- Wind/snowflake icon centered -->
  <g transform="translate(96,96)" stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main cross -->
    <line x1="0" y1="-52" x2="0" y2="52" stroke-width="10"/>
    <line x1="-52" y1="0" x2="52" y2="0" stroke-width="10"/>
    <!-- Diagonals -->
    <line x1="-36" y1="-36" x2="36" y2="36" stroke-width="10"/>
    <line x1="36" y1="-36" x2="-36" y2="36" stroke-width="10"/>
    <!-- Top arms -->
    <line x1="0" y1="-52" x2="-14" y2="-38" stroke-width="8"/>
    <line x1="0" y1="-52" x2="14" y2="-38" stroke-width="8"/>
    <!-- Bottom arms -->
    <line x1="0" y1="52" x2="-14" y2="38" stroke-width="8"/>
    <line x1="0" y1="52" x2="14" y2="38" stroke-width="8"/>
    <!-- Left arms -->
    <line x1="-52" y1="0" x2="-38" y2="-14" stroke-width="8"/>
    <line x1="-52" y1="0" x2="-38" y2="14" stroke-width="8"/>
    <!-- Right arms -->
    <line x1="52" y1="0" x2="38" y2="-14" stroke-width="8"/>
    <line x1="52" y1="0" x2="38" y2="14" stroke-width="8"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="10" fill="white" stroke="none"/>
  </g>
</svg>
